# Только изолированный integration стенд, без публичного listener.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 64
    spike_limit_mib: 16
exporters:
  file:
    path: /telemetry/traces.json
    flush_interval: 100ms
    rotation:
      max_megabytes: 8
      max_backups: 1
service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [file]
