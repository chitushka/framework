version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: gomod
    directories: ["/", /adapters, /integration, /examples/advanced-admin, /tools/security]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-patch-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-patch-minor:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: ["/", /integration, /examples/basic, /examples/advanced-admin]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
