name: Release validation

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  release-ready:
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - run: echo "All quality gates passed for this revision. Publishing is a separate owner-authorized operation."
