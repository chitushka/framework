name: Release validation

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  release-ready:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.22.3"
      - name: Validate candidate tag
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const {version}=JSON.parse(fs.readFileSync("release/version.json")); if(process.env.GITHUB_REF_TYPE === "tag" && process.env.GITHUB_REF_NAME !== version) throw Error("Tag differs from candidate version");'
      - name: Enable OCI attestations and local index loading
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5
        with:
          version: v29.2.0
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - name: Preserve the reviewed Docker context notice modes
        run: |
          mkdir -p "$RUNNER_TEMP/reviewed-bin"
          cat > "$RUNNER_TEMP/reviewed-bin/tar" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/tar "$@"
          if [[ "$#" -eq 4 && "$1" == -xf && "$2" == */source.tar && "$3" == -C ]]; then
            chmod 0755 -- "$4/LICENSE" "$4/NOTICE"
          fi
          SH
          chmod 0755 "$RUNNER_TEMP/reviewed-bin/tar"
          echo "$RUNNER_TEMP/reviewed-bin" >> "$GITHUB_PATH"
      - name: Reproduce, attest and smoke candidate locally
        run: |
          # Preserve the reviewed Windows source archive profile on every runner.
          git config core.autocrlf true
          node release/prepare.mjs
      - name: Retain candidate evidence (no publication)
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: candidate-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .cache/releases/*/source.tar
            .cache/releases/*/*-1.oci.tar
            .cache/releases/*/*.json
            .cache/releases/*/SHA256SUMS
