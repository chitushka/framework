name: Publish reviewed v1 OCI

on:
  push:
    branches: [release/v1.0.0-publish]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install OCI transport
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
      - name: Copy approved OCI archives without digest changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess, urllib.error, urllib.parse, urllib.request
          from pathlib import Path

          assert os.environ['GITHUB_REPOSITORY'] == 'chitushka/framework'
          assert os.environ['GITHUB_ACTOR'] == 'chitushka'
          token = os.environ['GITHUB_TOKEN']
          actor = os.environ['GITHUB_ACTOR']
          images = [
            {
              "starter": "basic",
              "assetID": 767995835,
              "archiveSHA256": "6351f0020b457aba088494eb8d05e17ef3daf5a9fe605b49056f6b78fa0dc476",
              "reference": "ghcr.io/chitushka/framework-basic:v1.0.0",
              "indexDigest": "sha256:1f34269a3dd1516b529860bf05bcd1458e9ad441744c01bff6f7d9aef7f5f723",
              "runtimeDigest": "sha256:3d8fd04ab404e10c5c37bbe0965935358834c63b3d621d6190040c8431df0466"
            },
            {
              "starter": "admin",
              "assetID": 767996132,
              "archiveSHA256": "abbf28101a5727d3f252194022a0406477c655635f8df7a540a5c1c266a04e8c",
              "reference": "ghcr.io/chitushka/framework-admin:v1.0.0",
              "indexDigest": "sha256:0de713a4703c1295c11966ab4a32d621ef27d8cb4c43ac58d2fcc3a33bac7414",
              "runtimeDigest": "sha256:5f3fe64feb66b8401034f5f38d8ca71cb7db37d6ebcdc294c896a9afa0e7519a"
            },
            {
              "starter": "rest",
              "assetID": 767996309,
              "archiveSHA256": "c568181b98db789739f47d529fb730b002a3cd24884ffbc9641345874737c137",
              "reference": "ghcr.io/chitushka/framework-rest:v1.0.0",
              "indexDigest": "sha256:883abe7faad10fe0b2d2c31e284b1f4e3e336eff919c091721d410e5fc053036",
              "runtimeDigest": "sha256:71037247d00f78a50de0134f2b77011582356a8fbc8ed883ed5c7a1c28028838"
            }
          ]
          temporary = Path(os.environ['RUNNER_TEMP'])

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def download(asset):
              url = 'https://api.github.com/repos/chitushka/framework/releases/assets/' + str(asset)
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/octet-stream', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'reviewed-v1-publisher'})
              try:
                  with urllib.request.build_opener(NoRedirect()).open(request, timeout=60) as response:
                      return response.read()
              except urllib.error.HTTPError as error:
                  assert error.code == 302, 'reviewed asset download failed: HTTP ' + str(error.code)
                  location = error.headers['Location']
                  target = urllib.parse.urlparse(location)
                  assert target.scheme == 'https' and (target.hostname.endswith('.githubusercontent.com') or target.hostname.endswith('.blob.core.windows.net') or target.hostname.endswith('.amazonaws.com')), 'unexpected asset storage origin'
              with urllib.request.urlopen(location, timeout=60) as response:
                  return response.read()

          def bearer(name):
              query = urllib.parse.urlencode({'service': 'ghcr.io', 'scope': 'repository:' + name + ':pull,push'})
              basic = base64.b64encode((actor + ':' + token).encode()).decode()
              request = urllib.request.Request('https://ghcr.io/token?' + query, headers={'Authorization': 'Basic ' + basic})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)['token']

          def manifest(name):
              request = urllib.request.Request('https://ghcr.io/v2/' + name + '/manifests/v1.0.0', headers={'Authorization': 'Bearer ' + bearer(name), 'Accept': 'application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.read()
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return None
                  raise

          for image in images:
              data = download(image['assetID'])
              assert hashlib.sha256(data).hexdigest() == image['archiveSHA256'], 'reviewed OCI archive differs'
              (temporary / (image['starter'] + '.oci.tar')).write_bytes(data)

          auth = temporary / 'ghcr-auth.json'
          auth.write_text(json.dumps({'auths': {'ghcr.io': {'auth': base64.b64encode((actor + ':' + token).encode()).decode()}}}))
          auth.chmod(0o600)
          try:
              for image in images:
                  name = image['reference'].split(':')[0].removeprefix('ghcr.io/')
                  existing = manifest(name)
                  if existing is not None:
                      assert 'sha256:' + hashlib.sha256(existing).hexdigest() == image['indexDigest'], 'refusing to overwrite a different version tag'
                  else:
                      subprocess.run(['skopeo', 'copy', '--all', '--preserve-digests', '--authfile', str(auth), 'oci-archive:' + str(temporary / (image['starter'] + '.oci.tar')), 'docker://' + image['reference']], check=True)
                  published = manifest(name)
                  assert published is not None and 'sha256:' + hashlib.sha256(published).hexdigest() == image['indexDigest'], 'registry changed the approved OCI index'
                  assert any(item['digest'] == image['runtimeDigest'] for item in json.loads(published)['manifests']), 'runtime descriptor differs'
                  print('Verified published digest: ' + image['reference'] + '@' + image['indexDigest'], flush=True)
          finally:
              auth.unlink(missing_ok=True)
          report = {'sourceCommit': '34138b2144663a3a2df7de2e38fbb320197ed37e', 'version': 'v1.0.0', 'preservedDigests': True, 'images': images, 'transport': subprocess.check_output(['skopeo', '--version'], text=True).strip()}
          (temporary / 'published-images.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
      - name: Retain publication digest receipt
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: v1.0.0-registry-publication
          path: ${{ runner.temp }}/published-images.json
          if-no-files-found: error
