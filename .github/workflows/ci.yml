name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(find . -name '*.go' -not -path './.cache/*' -not -path './frontend/node_modules/*' -print0 | xargs -0 gofmt -l)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Vet SDK adapters
        working-directory: adapters
        run: go vet ./...
      - name: Test SDK adapters
        working-directory: adapters
        run: go test -race ./...
      - name: Vet Advanced Admin module
        working-directory: examples/advanced-admin
        run: go vet ./...
      - name: Test Advanced Admin module
        working-directory: examples/advanced-admin
        run: go test -race ./...
      - name: Enforce core coverage
        run: sh ./scripts/check-coverage.sh coverage.out 80
      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
      - name: Lint Advanced Admin module
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          working-directory: examples/advanced-admin
          args: --build-tags integration
  windows:
    name: Windows / Go 1.26
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - name: Vet SDK adapters
        working-directory: adapters
        run: go vet ./...
      - name: Test SDK adapters
        working-directory: adapters
        run: go test ./...
      - name: Vet Advanced Admin module
        working-directory: examples/advanced-admin
        run: go vet ./...
      - name: Test Advanced Admin module
        working-directory: examples/advanced-admin
        run: go test ./...
  integration:
    name: Real service baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: SQL, Redis, Memcached, RabbitMQ and OpenTelemetry baseline
        run: sh scripts/integration.sh
  basic:
    name: Basic frontend build and browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Build from checkout and test development and production browser flows
        run: sh scripts/basic-e2e.sh
      - name: Upload Basic browser report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: basic-browser-report
          path: .cache/basic-e2e/
          include-hidden-files: true
          if-no-files-found: warn
  advanced-admin:
    name: Persistent Advanced Admin SQL and browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: PostgreSQL/MySQL, transactional authorization/audit, browser and restart
        run: sh scripts/admin-e2e.sh
      - name: Upload Advanced Admin browser report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: admin-browser-report
          path: .cache/admin-e2e/
          include-hidden-files: true
          if-no-files-found: warn
