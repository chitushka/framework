name: Extended fuzzing

on:
  schedule:
    - cron: "23 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extended-fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: Critical parsers / five minutes per target
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: sh scripts/test-fuzz.sh
      - run: sh scripts/fuzz.sh 5m
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: extended-fuzz
          path: |
            .cache/fuzz/
            web/testdata/fuzz/
            db/testdata/fuzz/
            cache/testdata/fuzz/
            auth/testdata/fuzz/
            session/testdata/fuzz/
          include-hidden-files: true
          if-no-files-found: error
