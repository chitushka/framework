name: Extended fuzzing

on:
  schedule:
    - cron: "23 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extended-fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: Critical parsers / five minutes per target
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: sh scripts/test-fuzz.sh
      - run: sh scripts/fuzz.sh 5m
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: extended-fuzz
          path: |
            .cache/fuzz/
            web/testdata/fuzz/
            db/testdata/fuzz/
            cache/testdata/fuzz/
            auth/testdata/fuzz/
            session/testdata/fuzz/
          include-hidden-files: true
          if-no-files-found: error
