<main class="login-shell"><a class="brand" href="/">chitu<span class="brand-dot">.</span><span class="brand-edition">ADMIN</span></a><section class="login-panel"><p class="eyebrow">ПАНЕЛЬ УПРАВЛЕНИЯ</p><h1>С возвращением</h1><p class="text-muted mb-4">Войдите в рабочее пространство.</p><div class="card"><div class="card-body p-4 p-sm-5">
{{if .Message}}<div class="alert alert-danger" role="alert">{{.Message}}</div>{{end}}
<form method="post" action="/login" novalidate><input type="hidden" name="_csrf" value="{{.CSRF}}"><div class="mb-4"><label class="form-label" for="username">Имя пользователя</label><input class="form-control" id="username" name="username" value="{{.User.Username}}" autocomplete="username" maxlength="64" required></div><div class="mb-4"><label class="form-label" for="password">Пароль</label><input class="form-control" id="password" type="password" name="password" autocomplete="current-password" maxlength="1024" required></div><button class="btn btn-primary w-100">Войти</button></form></div></div><p class="login-footer">Chitu Framework · Advanced Admin</p></section></main>
