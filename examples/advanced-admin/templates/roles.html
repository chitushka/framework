<div class="section-toolbar"><p class="text-muted">Разрешения сгруппированы в роли.</p><a class="btn btn-primary" href="/admin/roles/new">Создать роль</a></div><div class="card"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Роль</th><th>Описание</th><th>Разрешения</th><th>Действия</th></tr></thead><tbody>{{range .Roles}}<tr data-role-name="{{.Name}}" data-version="{{.Version}}"><td><code>{{.Name}}</code>{{if .Protected}} <span class="badge bg-secondary">Системная</span>{{end}}</td><td>{{.Description}}</td><td>{{range .Permissions}}<span class="permission-tag">{{.}}</span> {{end}}</td><td>{{if not .Protected}}<div class="row-actions"><a href="/admin/roles/{{.Name}}/edit">Изменить</a><form method="post" action="/admin/roles/{{.Name}}/delete"><input type="hidden" name="_csrf" value="{{$.CSRF}}"><input type="hidden" name="version" value="{{.Version}}"><button class="btn btn-sm btn-outline-danger">Удалить</button></form></div>{{end}}</td></tr>{{end}}</tbody></table></div></div>
