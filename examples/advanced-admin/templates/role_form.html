<div class="card form-card mt-4"><div class="card-body">{{if .Message}}<div class="alert alert-danger" role="alert">{{.Message}}</div>{{end}}<form method="post" action="{{if .Creating}}/admin/roles/new{{else}}/admin/roles/{{.Role.Name}}/edit{{end}}" novalidate><input type="hidden" name="_csrf" value="{{.CSRF}}"><input type="hidden" name="version" value="{{.Role.Version}}"><div class="mb-3"><label class="form-label" for="name">Название роли</label><input class="form-control" id="name" name="name" value="{{.Role.Name}}" maxlength="64" {{if not .Creating}}readonly{{end}} required></div><div class="mb-4"><label class="form-label" for="description">Описание</label><input class="form-control" id="description" name="description" value="{{.Role.Description}}" maxlength="120" required></div><fieldset class="mb-4"><legend class="h5">Разрешения</legend>{{range .PermissionNames}}<div class="form-check mb-2"><input class="form-check-input" type="checkbox" id="permission-{{.}}" name="permissions" value="{{.}}" {{if has $.Role.Permissions .}}checked{{end}} {{if not (index $.Capabilities .)}}disabled{{end}}><label class="form-check-label" for="permission-{{.}}">{{.}}</label></div>{{end}}</fieldset><div class="row-actions"><button class="btn btn-primary">Сохранить</button><a href="/admin/roles">Отмена</a></div></form></div></div>
