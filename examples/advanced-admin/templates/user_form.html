<div class="card form-card mt-4"><div class="card-body">{{if .Message}}<div class="alert alert-danger" role="alert">{{.Message}}</div>{{end}}<form method="post" action="{{if .Creating}}/admin/users/new{{else}}/admin/users/{{.User.ID}}/edit{{end}}" novalidate><input type="hidden" name="_csrf" value="{{.CSRF}}"><input type="hidden" name="version" value="{{.User.Version}}"><div class="mb-3"><label class="form-label" for="username">Имя пользователя</label><input class="form-control" id="username" name="username" value="{{.User.Username}}" maxlength="64" autocomplete="off" required></div><div class="mb-3"><label class="form-label" for="display_name">Отображаемое имя</label><input class="form-control" id="display_name" name="display_name" value="{{.User.DisplayName}}" maxlength="120" required></div><div class="mb-3"><label class="form-label" for="password">{{if .Creating}}Пароль{{else}}Новый пароль{{end}}</label><input class="form-control" type="password" id="password" name="password" autocomplete="new-password" maxlength="1024"><p class="text-muted small mt-2">12–1024 байта. {{if not .Creating}}Оставьте пустым, чтобы сохранить текущий пароль.{{end}}</p></div><div class="mb-4"><label class="form-label" for="active">Статус</label><select class="form-select" id="active" name="active"><option value="1" {{if eq .User.Active 1}}selected{{end}}>Активен</option><option value="0" {{if eq .User.Active 0}}selected{{end}}>Отключён</option></select></div><div class="row-actions"><button class="btn btn-primary">Сохранить</button><a href="/admin/users">Отмена</a></div></form></div></div>
