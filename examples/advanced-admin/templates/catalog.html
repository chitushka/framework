<div class="section-toolbar"><p class="text-muted">Записи справочника и их названия.</p>{{if index .Capabilities "catalog.manage"}}<a class="btn btn-primary" href="/admin/catalog/new">Создать запись</a>{{end}}</div>
<div class="card"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Код</th><th>Название</th><th>Действия</th></tr></thead><tbody>{{range .Catalog}}<tr data-record-id="{{.ID}}" data-version="{{.Version}}"><td><code>{{.Code}}</code></td><td>{{.Name}}</td><td>{{if index $.Capabilities "catalog.manage"}}<div class="row-actions"><a href="/admin/catalog/{{.ID}}/edit">Изменить</a><form method="post" action="/admin/catalog/{{.ID}}/delete"><input type="hidden" name="_csrf" value="{{$.CSRF}}"><input type="hidden" name="version" value="{{.Version}}"><button class="btn btn-sm btn-outline-danger">Удалить</button></form></div>{{end}}</td></tr>{{else}}<tr><td colspan="3">Записей пока нет.</td></tr>{{end}}</tbody></table></div></div><nav class="pagination-bar" aria-label="Страницы"><a href="?page={{.Previous}}">← Назад</a><span>Страница {{.Page}}</span><a href="?page={{.Next}}">Далее →</a></nav>
