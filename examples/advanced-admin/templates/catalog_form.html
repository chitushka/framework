<div class="card form-card mt-4"><div class="card-body">{{if .Message}}<div class="alert alert-danger" role="alert">{{.Message}}</div>{{end}}<form method="post" action="{{if .Creating}}/admin/catalog/new{{else}}/admin/catalog/{{.Item.ID}}/edit{{end}}" novalidate><input type="hidden" name="_csrf" value="{{.CSRF}}"><input type="hidden" name="version" value="{{.Item.Version}}"><div class="mb-3"><label class="form-label" for="code">Код</label><input class="form-control" id="code" name="code" value="{{.Item.Code}}" maxlength="64" required></div><div class="mb-4"><label class="form-label" for="name">Название</label><input class="form-control" id="name" name="name" value="{{.Item.Name}}" maxlength="200" required></div><div class="row-actions"><button class="btn btn-primary">Сохранить</button><a href="/admin/catalog">Отмена</a></div></form></div></div>
