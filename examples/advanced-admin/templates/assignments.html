<p class="text-muted mt-3 mb-4">Роли задают доступ пользователя к разделам. Недоступные вам разрешения передавать нельзя.</p><div class="assignment-grid">{{range .Assignments}}{{$row := .}}<section class="card" data-user-id="{{.User.ID}}" data-version="{{.User.Version}}"><div class="card-body"><h2 class="h4">{{.User.Username}}</h2><p class="text-muted">{{.User.DisplayName}}</p><div class="assigned-roles">{{range .Roles}}<form method="post" action="/admin/assignments/revoke" class="role-chip"><input type="hidden" name="_csrf" value="{{$.CSRF}}"><input type="hidden" name="user_id" value="{{$row.User.ID}}"><input type="hidden" name="version" value="{{$row.User.Version}}"><input type="hidden" name="role" value="{{.}}"><span>{{.}}</span><button class="btn btn-sm btn-outline-danger" aria-label="Отозвать {{.}}">×</button></form>{{else}}<p class="small text-muted">Ролей пока нет.</p>{{end}}</div><form method="post" action="/admin/assignments/add" class="grant-form"><input type="hidden" name="_csrf" value="{{$.CSRF}}"><input type="hidden" name="user_id" value="{{.User.ID}}"><input type="hidden" name="version" value="{{.User.Version}}"><label class="form-label" for="role-{{.User.ID}}">Добавить роль</label><div class="row-actions"><select class="form-select" id="role-{{.User.ID}}" name="role">{{range $.Roles}}<option value="{{.Name}}">{{.Name}}</option>{{end}}</select><button class="btn btn-primary">Назначить</button></div></form></div></section>{{end}}</div><nav class="pagination-bar" aria-label="Страницы"><a href="?page={{.Previous}}">← Назад</a><span>Страница {{.Page}}</span><a href="?page={{.Next}}">Далее →</a></nav>
